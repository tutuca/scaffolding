<button class="chrome-burger" type="button" aria-expanded="false" aria-controls="chrome-menu">Menú</button>
<nav class="chrome-nav" id="chrome-menu" aria-label="Principal">
  <ul>
    <li><a class="chrome-brand" href="/"{% if request.path == "/" %} aria-current="page"{% endif %}>Inicio</a></li>
    {% if user.active_taxpayer %}
      {% url 'movimientos' as u %}<li><a href="{{ u }}"{% if u in request.path %} aria-current="page"{% endif %}>Movimientos</a></li>
      {% url 'inversiones' as u %}<li><a href="{{ u }}"{% if u in request.path %} aria-current="page"{% endif %}>Inversiones</a></li>
      {% url 'planes' as u %}<li><a href="{{ u }}"{% if u in request.path %} aria-current="page"{% endif %}>Planes</a></li>
      <li><a href="/data/invoice/"{% if "/data/" in request.path %} aria-current="page"{% endif %}>Admin</a></li>
    {% endif %}
  </ul>
</nav>
<div class="chrome-end">
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button type="submit">Salir</button></form>
  {% else %}
    <a href="{% url 'account_login' %}">Entrar</a>
  {% endif %}
</div>
