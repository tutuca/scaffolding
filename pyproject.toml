[project]
name = "scaffolding"
description = "A multi-tenant Django application scaffold."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "Matias Iturburu" }]
dynamic = ["version"]
dependencies = [
  "django<7",
  "djangorestframework",
  "drf-spectacular",
  "django-environ",
  "django-tasks-db>=0.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-django",
  "model-bakery",
  "ruff",
  "mypy",
  "django-stubs",
  "djangorestframework-stubs[compatible-mypy]",
  "ipdb",
  "tornado",
  "pillow",
]

[project.scripts]
scaffolding = "scaffolding.manage:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

# What a wheel ships besides the .py modules. Explicit, so the UI (templates and
# static of `ui/`) and the typing marker ride into every build regardless of git
# state. The packaging test (tests/scaffolding/packaging/) pins exactly this.
[tool.setuptools.package-data]
scaffolding = [
  "py.typed",
  "ui/static/**/*",
  "ui/templates/**/*",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
  "E402",
  "PLC0415",
  "I",
  "ANN",
  "E722",
  "BLE",
  "DJ",
]
ignore = [
  "RUF012",
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/scaffolding/data/migrations/*" = ["B009", "FURB157", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["scaffolding"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_explicit = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "scaffolding.data.models.*"
disallow_untyped_defs = false
disable_error_code = ["var-annotated", "assignment"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = ["no-any-return"]

[tool.django-stubs]
django_settings_module = "scaffolding.conf.settings"

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Darwin"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["src/scaffolding/data/migrations"]
typeCheckingMode = "standard"

reportAttributeAccessIssue = "warning"
reportReturnType = "warning"
reportArgumentType = "warning"
reportOperatorIssue = "warning"
reportIndexIssue = "warning"
reportCallIssue = "warning"
reportOptionalMemberAccess = "warning"
reportMissingTypeArgument = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportIncompatibleVariableOverride = "none"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "-m", "not integration",
  "--cov=src",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html:.reports/tests/coverage",
]
markers = []
python_files = ["test_*.py", "tests.py", "*_tests.py"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
  "src/scaffolding/manage.py",
  "src/scaffolding/wsgi.py",
  "src/scaffolding/asgi.py",
  "src/scaffolding/data/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "@abstractmethod",
  '\.\.\.\s*$',
  "if TYPE_CHECKING:",
]
show_missing = true
