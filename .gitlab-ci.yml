default:
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
      - dist/

variables:
  VERSION: 0.0.1
  IMG_NAME: registry.gitlab.com/bigpear.adm/scaffolding
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

stages:
  - build
  - publish
  - docker
  - deploy

build_wheel:
  stage: build
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - .bumpversion.cfg
  script:
    - pip install wheel build nodeenv
    - nodeenv -n lts `pwd`.node
    - export PATH=$PATH:`pwd`.node/bin
    - npm install
    - npm run build
    - python -m build

  artifacts:
    paths:
      - dist/

publish_package:
  stage: publish
  variables:
    CRYPTOGRAPHY_DONT_BUILD_RUST: 1
    TWINE_PASSWORD: $CI_REGISTRY_PASSWORD
    TWINE_USERNAME: $CI_REGISTRY_USER
    PIP_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - .bumpversion.cfg
  script:
    - pip install twine
    - python -m twine upload --skip-existing --repository-url $PIP_URL dist/*

build_docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - .bumpversion.cfg
  before_script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin registry.gitlab.com
    - cp etc/docker-compose.override.yml.skel docker-compose.override.yml
    - apk --update add make
  script:
    - docker compose build --pull
    - docker compose push
    - make bundle
  artifacts:
    paths:
      - "*.tar.bz2"

pages:
  stage: build
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - docs/**/*
        - mkdocs.yml
  before_script:
    - apt update -y && apt install -y libpango-1.0-0 libpangoft2-1.0-0
    - pip install -e .[docs]
  script:
    - mkdocs build
    - htmlark public/index.html -o public/index.html
  artifacts:
    paths:
      - public

deploy_production:
  stage: deploy
  variables:
    BUILD_PATH: /home/gitlab-runner/builds/$ALPHA_RUNNER_ID/0/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - .bumpversion.cfg
  tags:
    - production
  script:
    - rsync -PhrazO $BUILD_PATH/{Makefile,docker-compose.yml,etc,bin,docs,dist/tren-$VERSION.tar.gz} /home/deploy/web/
    - cd /home/deploy/web/bin/
    - ./update.sh
